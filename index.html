<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aryan's Adventure - Text Adventure RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scan-line"></div>
    <div class="container">
        <header>
            <h1>ARYAN'S ADVENTURE</h1>
            <p class="subtitle">A TEXT ADVENTURE GAME</p>
        </header>

        <div class="main-content">
            <div class="story-text" id="story"></div>
            
            <div class="stats-line" id="stats">
                <div class="stat-item">
                    <span class="stat-label">HEALTH:</span>
                    <span class="stat-value" id="health-text">100/100</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">LEVEL:</span>
                    <span class="stat-value" id="level-text">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">EXP:</span>
                    <span class="stat-value" id="exp-text">0/100</span>
                </div>
            </div>

            <div class="choices-container" id="choices"></div>
        </div>

        <footer>
            <button class="btn-restart" id="restart-btn">[NEW GAME]</button>
            <button class="btn-save" id="save-btn">[SAVE]</button>
            <button class="btn-load" id="load-btn">[LOAD]</button>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
